<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de QR Serverless</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
  <div class="max-w-xl mx-auto py-10 text-center">
    <h1 class="text-3xl font-bold mb-6">Generador de Códigos QR</h1>
    <input id="qrText" type="text" placeholder="Ingresa texto..." class="w-full p-3 rounded bg-gray-800 border border-gray-700 mb-4" />

    <button onclick="generateQR()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded mr-2">Generar QR</button>
    <button onclick="saveQR()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded mr-2">Guardar QR</button>
    <button onclick="loadHistory()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded">Ver Historial</button>

    <div id="qrResult" class="mt-6"></div>

    <div id="history" class="mt-10 grid grid-cols-2 gap-4"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
